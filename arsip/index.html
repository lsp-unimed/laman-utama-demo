<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arsip Dokumen — LSP UNIMED</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="arsip.css">
</head>
<body>
<div class="demo-flag">Demo tampilan Arsip Dokumen (arsip.lsp.unimed.ac.id) — data contoh, belum tersambung ke penyimpanan.</div>
<div id="app"></div>

<script>
(function () {
  'use strict';
  const HARI_INI = '2026-10-10';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  const tgl = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-').map(Number); return d + ' ' + BLN[m - 1] + ' ' + y; };
  const hari = (s) => Math.round((new Date(s) - new Date(HARI_INI)) / 86400000);

  /* ---------- Kategori & data contoh ---------- */
  const KAT = [
    ['LIS', 'Lisensi & legalitas', 'SK pendirian, SK pengurus, lisensi BNSP', 'Permanen'],
    ['MUT', 'Dokumen mutu', 'Panduan mutu, SOP, instruksi kerja, formulir', 'Selama berlaku + 5 tahun'],
    ['SKM', 'Skema & MUK', 'Dokumen skema dan materi uji kompetensi', 'Selama skema berlaku'],
    ['ASR', 'Asesor', 'Sertifikat asesor, SK penugasan, perjanjian kerahasiaan', 'Selama aktif + 5 tahun'],
    ['TUK', 'Tempat uji', 'SK penetapan, verifikasi TUK, daftar peralatan', 'Selama aktif + 5 tahun'],
    ['ASM', 'Rekaman asesmen', 'Daftar hadir, berita acara, rekaman MUK per jadwal', '5 tahun'],
    ['MNJ', 'Rapat & manajemen', 'Kaji ulang manajemen, audit internal, rapat pleno', '5 tahun'],
    ['KOR', 'Surat-menyurat', 'Surat masuk dan surat keluar', '5 tahun']
  ];
  const katNama = (k) => (KAT.find(x => x[0] === k) || [k, k])[1];
  const D = [
    ['LIS', 'SK Rektor tentang Pendirian LSP UNIMED', 'Sekretariat', '2019-03-11', '', 'Berlaku', 1],
    ['LIS', 'SK Lisensi BNSP KEP.0650/BNSP/IV/2021', 'Sekretariat', '2021-04-06', '2026-04-06', 'Berlaku', 1],
    ['LIS', 'SK Pengurus LSP UNIMED periode 2025–2029', 'Sekretariat', '2025-01-15', '', 'Berlaku', 1],
    ['MUT', 'Panduan Mutu LSP UNIMED', 'Manajemen Mutu', '2025-02-01', '', 'Berlaku', 4],
    ['MUT', 'Daftar Induk Dokumen', 'Manajemen Mutu', '2026-09-30', '', 'Berlaku', 9],
    ['MUT', 'SOP XVII/SOP-PKS Pelayanan Kegiatan Sertifikasi', 'Manajemen Mutu', '2026-01-10', '', 'Berlaku', 3],
    ['MUT', 'SOP Penanganan Banding', 'Manajemen Mutu', '2025-02-01', '', 'Berlaku', 2],
    ['MUT', 'SOP Penanganan Keluhan', 'Manajemen Mutu', '2025-02-01', '', 'Berlaku', 2],
    ['MUT', 'Formulir FR.APL.01 Permohonan Sertifikasi', 'Sertifikasi', '2026-08-01', '', 'Berlaku', 2],
    ['MUT', 'Formulir FR.APL.02 Asesmen Mandiri', 'Sertifikasi', '2026-08-01', '', 'Berlaku', 2],
    ['SKM', 'Skema Okupasi Web Developer', 'Skema', '2026-07-20', '', 'Berlaku', 1],
    ['SKM', 'Skema Kualifikasi IV Teknik Sepeda Motor', 'Skema', '2026-07-20', '', 'Berlaku', 1],
    ['SKM', 'Skema Klaster Penyediaan Makanan di Institusi', 'Skema', '2026-07-20', '', 'Berlaku', 1],
    ['SKM', 'MUK Okupasi Web Developer', 'Skema', '2026-10-03', '', 'Berlaku', 1],
    ['SKM', 'MUK Okupasi Welding Inspector Standard', 'Skema', '2026-10-03', '', 'Draf', 1],
    ['ASR', 'Sertifikat Asesor — Ali Akbar Lubis (MET 000.000687 2023)', 'Sertifikasi', '2023-11-02', '2026-11-02', 'Berlaku', 1],
    ['ASR', 'Sertifikat Asesor — Tuti Sriwedari (MET 000.000989 2021)', 'Sertifikasi', '2021-12-01', '2026-12-01', 'Berlaku', 1],
    ['ASR', 'Sertifikat Asesor — Hanapi Hasan (MET 000.000689 2023)', 'Sertifikasi', '2023-11-02', '2026-11-02', 'Berlaku', 1],
    ['ASR', 'SK Penugasan Asesor Uji Kompetensi 17 Oktober 2026', 'Sertifikasi', '2026-10-05', '', 'Berlaku', 1],
    ['ASR', 'Pakta Integritas & Kerahasiaan Asesor 2026', 'Manajemen Mutu', '2026-10-05', '', 'Berlaku', 1],
    ['TUK', 'SK Penetapan 12 TUK LSP UNIMED', 'Sekretariat', '2026-09-15', '2027-09-15', 'Berlaku', 1],
    ['TUK', 'Berita Acara Verifikasi TUK Otomotif', 'Sertifikasi', '2026-09-12', '2027-09-12', 'Berlaku', 1],
    ['TUK', 'Berita Acara Verifikasi TUK Welding', 'Sertifikasi', '2026-09-12', '2027-09-12', 'Berlaku', 1],
    ['TUK', 'Daftar Peralatan TUK Multimedia dan Pemrograman', 'Sertifikasi', '2026-09-12', '', 'Berlaku', 1],
    ['ASM', 'Daftar Hadir Uji Kompetensi 17 Oktober 2026', 'Sekretariat', '', '', 'Draf', 1],
    ['ASM', 'Berita Acara Asesmen 17 Oktober 2026', 'Sertifikasi', '', '', 'Draf', 1],
    ['MNJ', 'Notulen Kaji Ulang Manajemen 2025', 'Manajemen Mutu', '2025-12-18', '', 'Berlaku', 1],
    ['MNJ', 'Laporan Audit Internal 2026', 'Manajemen Mutu', '2026-09-28', '', 'Draf', 1],
    ['MNJ', 'Notulen Rapat Persiapan Penyaksian BNSP', 'Sekretariat', '2026-10-01', '', 'Berlaku', 1],
    ['KOR', 'Surat 071/LSP-UNIMED/X/2026 — Daftar Asesor & TUK', 'Sekretariat', '2026-10-02', '', 'Berlaku', 1],
    ['KOR', 'Surat BNSP — Jadwal Penyaksian', 'Sekretariat', '2026-09-20', '', 'Berlaku', 1]
  ];
  const seq = {};
  let DOCS = D.map((d, i) => {
    const y = (d[3] || HARI_INI).slice(0, 4); seq[d[0]] = (seq[d[0]] || 0) + 1;
    return { id: i + 1, kode: `LSP-UNIMED/${d[0]}/${String(seq[d[0]]).padStart(3, '0')}/${y}`, kat: d[0], judul: d[1], pemilik: d[2], terbit: d[3], sampai: d[4], status: d[5], rev: d[6],
      berkas: d[1].replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.pdf' };
  });
  const status = (d) => {
    if (d.status === 'Draf') return ['Draf', 'draft'];
    if (d.sampai) { const h = hari(d.sampai); if (h < 0) return ['Kedaluwarsa', 'bad']; if (h <= 60) return ['Segera berakhir', 'warn']; }
    return ['Berlaku', 'ok'];
  };
  const LOG = [
    ['2026-10-09 15:42', 'Sekretariat', 'Mengunggah revisi 9 Daftar Induk Dokumen'],
    ['2026-10-05 10:18', 'Sertifikasi', 'Mencatat SK Penugasan Asesor 17 Oktober 2026'],
    ['2026-10-03 14:05', 'Skema', 'Mencatat MUK Okupasi Web Developer'],
    ['2026-10-01 09:30', 'Sekretariat', 'Mencatat Notulen Rapat Persiapan Penyaksian BNSP'],
    ['2026-09-28 16:11', 'Manajemen Mutu', 'Menyimpan draf Laporan Audit Internal 2026']
  ];

  /* ---------- Kesiapan penyaksian / audit ---------- */
  const AUDIT = [
    ['Panduan mutu dan daftar induk dokumen', 'ok', 'Revisi terbaru 30 Sep 2026'],
    ['SK pendirian dan SK pengurus LSP', 'ok', 'Lengkap'],
    ['Lisensi BNSP', 'bad', 'Masa berlaku berakhir 6 Apr 2026 — lampirkan bukti proses perpanjangan'],
    ['Dokumen skema (16 skema)', 'ok', '16 dari 16 tercatat'],
    ['MUK per skema', 'warn', '12 dari 16 disahkan, 4 masih draf'],
    ['Sertifikat asesor aktif (16 asesor)', 'warn', '16 tercatat, 3 berakhir dalam 60 hari'],
    ['Verifikasi TUK (12 TUK)', 'ok', '12 berita acara tercatat'],
    ['SK penugasan asesor & pakta integritas', 'ok', 'Untuk jadwal 17 Okt 2026'],
    ['Rekaman asesmen 17 Okt 2026', 'warn', 'Diisi setelah uji kompetensi berlangsung'],
    ['Audit internal & kaji ulang manajemen', 'warn', 'Audit internal 2026 masih draf']
  ];

  /* ---------- Tampilan ---------- */
  const app = document.getElementById('app');
  let VIEW = 'ringkasan', FK = '', Q = '', FS = '';
  const toast = (m) => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };

  function login() {
    app.innerHTML = `<div class="login"><div class="art"><div><h1>Arsip dokumen LSP UNIMED</h1><p>Ruang kerja petugas untuk mencatat, menyimpan, dan menemukan kembali seluruh dokumen lembaga — dari panduan mutu sampai berita acara asesmen.</p>
      <ul><li>Penomoran dokumen otomatis</li><li>Riwayat revisi setiap dokumen</li><li>Pengingat dokumen yang segera berakhir</li><li>Daftar kesiapan penyaksian dan audit BNSP</li></ul></div><p style="font-size:.85rem">Akses khusus petugas LSP. Login memakai akun yang sama dengan panel admin SIPINTAR.</p></div>
      <form id="fL"><img src="../assets/img/logo-lsp.png" alt="LSP UNIMED"><h2>Masuk petugas</h2><label class="f">Username<input value="sekretariat" autocomplete="username"></label><label class="f">Password<input type="password" value="demo" autocomplete="current-password"></label><button class="btn" type="submit">Masuk</button><p class="muted" style="font-size:.84rem;margin:0">Demo: tekan Masuk, isian tidak diperiksa.</p><a href="../index.html" style="font-size:.88rem">Kembali ke situs LSP</a></form></div>`;
    document.getElementById('fL').onsubmit = (e) => { e.preventDefault(); shell(); };
  }

  function shell() {
    const n = (k) => DOCS.filter(d => d.kat === k).length;
    const reminders = DOCS.filter(d => ['warn', 'bad'].includes(status(d)[1])).length;
    app.innerHTML = `<div class="shell"><aside class="side" id="side">
      <div class="brand"><img src="../assets/img/logo-lsp.png" alt=""><div><b>Arsip Dokumen</b><span>LSP UNIMED</span></div></div>
      <button data-v="ringkasan">Ringkasan</button>
      <button data-v="dokumen" data-k="">Semua dokumen <span class="n">${DOCS.length}</span></button>
      <button data-v="pengingat">Pengingat <span class="n">${reminders}</span></button>
      <button data-v="audit">Kesiapan penyaksian</button>
      <button data-v="aktivitas">Riwayat aktivitas</button>
      <div class="grp">Kategori</div>
      ${KAT.map(k => `<button data-v="dokumen" data-k="${k[0]}">${esc(k[1])} <span class="n">${n(k[0])}</span></button>`).join('')}
      <div class="foot">Masuk sebagai <b style="color:#fff">Sekretariat LSP</b><br><a href="#" id="out">Keluar</a> · <a href="../index.html">Situs LSP</a></div>
    </aside><div class="main"><div class="top"><div style="display:flex;gap:10px;align-items:center"><button class="menu" id="menu" aria-label="Menu">☰</button><h1 id="title" style="margin:0"></h1></div><button class="btn" id="add">+ Catat dokumen</button></div><div id="view"></div></div></div>`;
    document.getElementById('side').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-v]'); if (!b) return;
      VIEW = b.dataset.v; FK = b.dataset.k || ''; document.body.classList.remove('nav-open'); render();
    });
    document.getElementById('menu').onclick = () => document.body.classList.toggle('nav-open');
    document.getElementById('out').onclick = (e) => { e.preventDefault(); login(); };
    document.getElementById('add').onclick = () => form();
    render();
  }

  function render() {
    document.querySelectorAll('.side button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW && (VIEW !== 'dokumen' || (b.dataset.k || '') === FK)));
    const v = document.getElementById('view'), T = document.getElementById('title');
    if (VIEW === 'ringkasan') {
      T.textContent = 'Ringkasan';
      const warn = DOCS.filter(d => status(d)[1] === 'warn'), bad = DOCS.filter(d => status(d)[1] === 'bad'), draf = DOCS.filter(d => d.status === 'Draf');
      const siap = Math.round(AUDIT.filter(a => a[1] === 'ok').length / AUDIT.length * 100);
      v.innerHTML = `<div class="grid g4" style="margin-bottom:14px">
          <div class="panel stat"><b>${DOCS.length}</b><span>dokumen tercatat</span></div>
          <div class="panel stat warn"><b>${warn.length}</b><span>segera berakhir (60 hari)</span></div>
          <div class="panel stat bad"><b>${bad.length}</b><span>sudah kedaluwarsa</span></div>
          <div class="panel stat"><b>${draf.length}</b><span>draf menunggu pengesahan</span></div></div>
        <div class="grid g2">
          <div class="panel"><h2>Kesiapan penyaksian BNSP</h2><div class="bar"><i style="width:${siap}%"></i></div><p class="muted" style="font-size:.88rem">${siap}% butir siap. ${AUDIT.filter(a => a[1] !== 'ok').length} butir perlu ditindaklanjuti.</p>
            ${AUDIT.filter(a => a[1] !== 'ok').slice(0, 4).map(a => `<div class="check"><span class="dot ${a[1]}"></span><div><b>${esc(a[0])}</b><div class="muted" style="font-size:.84rem">${esc(a[2])}</div></div><span></span></div>`).join('')}
            <p style="margin:10px 0 0"><a href="#" data-go="audit">Lihat semua butir</a></p></div>
          <div class="panel"><h2>Aktivitas terbaru</h2><ul class="list">${LOG.slice(0, 5).map(l => `<li><span>${esc(l[2])}<br><span class="muted" style="font-size:.82rem">${esc(l[1])}</span></span><span class="muted" style="font-size:.82rem;white-space:nowrap">${esc(l[0].slice(5, 10).split('-').reverse().join('/'))}</span></li>`).join('')}</ul></div>
        </div>
        <div class="panel" style="margin-top:14px"><h2>Per kategori</h2><div class="grid g4">${KAT.map(k => `<a href="#" data-cat="${k[0]}" style="text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px"><b style="font-size:1.4rem">${DOCS.filter(d => d.kat === k[0]).length}</b><div style="font-weight:700">${esc(k[1])}</div><div class="muted" style="font-size:.8rem">${esc(k[2])}</div></a>`).join('')}</div></div>`;
      v.querySelectorAll('[data-go]').forEach(a => a.onclick = (e) => { e.preventDefault(); VIEW = a.dataset.go; render(); });
      v.querySelectorAll('[data-cat]').forEach(a => a.onclick = (e) => { e.preventDefault(); VIEW = 'dokumen'; FK = a.dataset.cat; render(); });
    } else if (VIEW === 'dokumen') {
      T.textContent = FK ? katNama(FK) : 'Semua dokumen';
      const k = KAT.find(x => x[0] === FK);
      v.innerHTML = `${k ? `<p class="muted" style="margin-top:-8px">${esc(k[2])} · Masa simpan: ${esc(k[3])}</p>` : ''}
        <div class="toolbar"><input id="q" placeholder="Cari judul atau nomor dokumen" value="${esc(Q)}"><select id="fs"><option value="">Semua status</option>${['Berlaku', 'Segera berakhir', 'Kedaluwarsa', 'Draf'].map(s => `<option ${FS === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div class="table-wrap"><table><thead><tr><th>Nomor</th><th>Judul</th>${FK ? '' : '<th>Kategori</th>'}<th>Rev.</th><th>Berlaku sampai</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>`;
      const draw = () => {
        const list = DOCS.filter(d => (!FK || d.kat === FK) && (!FS || status(d)[0] === FS) && (!Q || (d.judul + ' ' + d.kode).toLowerCase().includes(Q.toLowerCase())));
        document.getElementById('tb').innerHTML = list.map(d => { const s = status(d); return `<tr data-id="${d.id}"><td class="code" data-l="Nomor">${esc(d.kode)}</td><td data-l="Judul">${esc(d.judul)}<div class="muted" style="font-size:.8rem">${esc(d.pemilik)}</div></td>${FK ? '' : `<td data-l="Kategori">${esc(katNama(d.kat))}</td>`}<td data-l="Revisi">${d.rev}</td><td data-l="Berlaku sampai">${d.sampai ? tgl(d.sampai) : 'Tidak terbatas'}</td><td data-l="Status"><span class="badge ${s[1]}">${s[0]}</span></td></tr>`; }).join('') || `<tr><td colspan="6" class="muted" style="text-align:center;padding:28px">Belum ada dokumen. Tekan "Catat dokumen" untuk menambahkan.</td></tr>`;
      };
      document.getElementById('q').oninput = (e) => { Q = e.target.value; draw(); };
      document.getElementById('fs').onchange = (e) => { FS = e.target.value; draw(); };
      document.getElementById('tb').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) detail(+tr.dataset.id); };
      draw();
    } else if (VIEW === 'pengingat') {
      T.textContent = 'Pengingat';
      const list = DOCS.filter(d => ['warn', 'bad'].includes(status(d)[1]) || d.status === 'Draf').sort((a, b) => (a.sampai || '9999').localeCompare(b.sampai || '9999'));
      v.innerHTML = `<p class="muted" style="margin-top:-8px">Dokumen yang kedaluwarsa, berakhir dalam 60 hari, atau masih draf. Pengingat juga dikirim ke email penanggung jawab setiap Senin.</p>
        <div class="panel"><ul class="list">${list.map(d => { const s = status(d); const h = d.sampai ? hari(d.sampai) : null; return `<li data-id="${d.id}" style="cursor:pointer"><span><b>${esc(d.judul)}</b><br><span class="muted" style="font-size:.84rem">${esc(d.kode)} · ${esc(d.pemilik)}</span></span><span style="text-align:right"><span class="badge ${s[1]}">${s[0]}</span><br><span class="muted" style="font-size:.8rem">${h === null ? 'Perlu pengesahan' : h < 0 ? 'Lewat ' + (-h) + ' hari' : h + ' hari lagi'}</span></span></li>`; }).join('')}</ul></div>`;
      v.querySelectorAll('li[data-id]').forEach(li => li.onclick = () => detail(+li.dataset.id));
    } else if (VIEW === 'audit') {
      T.textContent = 'Kesiapan penyaksian';
      const ok = AUDIT.filter(a => a[1] === 'ok').length;
      v.innerHTML = `<p class="muted" style="margin-top:-8px">Butir bukti yang biasa diperiksa saat penyaksian dan surveilans BNSP (mengacu PBNSP 201/202 dan ISO/IEC 17024). Status dihitung otomatis dari dokumen yang tercatat.</p>
        <div class="panel"><div class="bar"><i style="width:${Math.round(ok / AUDIT.length * 100)}%"></i></div><p class="muted" style="font-size:.88rem">${ok} dari ${AUDIT.length} butir siap</p>
        ${AUDIT.map(a => `<div class="check"><span class="dot ${a[1]}"></span><div><b>${esc(a[0])}</b><div class="muted" style="font-size:.84rem">${esc(a[2])}</div></div><span class="badge ${a[1]}">${a[1] === 'ok' ? 'Siap' : a[1] === 'warn' ? 'Perlu dilengkapi' : 'Mendesak'}</span></div>`).join('')}</div>`;
    } else {
      T.textContent = 'Riwayat aktivitas';
      v.innerHTML = `<p class="muted" style="margin-top:-8px">Setiap pencatatan, revisi, dan pengunduhan dokumen tercatat dan tidak dapat diubah.</p><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Petugas</th><th>Aktivitas</th></tr></thead><tbody>${LOG.map(l => `<tr><td style="white-space:nowrap">${esc(l[0])}</td><td>${esc(l[1])}</td><td>${esc(l[2])}</td></tr>`).join('')}</tbody></table></div>`;
    }
  }

  function detail(id) {
    const d = DOCS.find(x => x.id === id), s = status(d);
    const vers = Array.from({ length: d.rev }, (_, i) => d.rev - i).map(r => `<div><b>Revisi ${r}${r === d.rev ? ' (berlaku)' : ''}</b><span class="muted">${r === d.rev ? tgl(d.terbit || HARI_INI) : 'Diganti oleh revisi ' + (r + 1)}</span></div>`).join('');
    document.body.insertAdjacentHTML('beforeend', `<div class="drawer-back"><div class="drawer" role="dialog" aria-modal="true"><button class="x" aria-label="Tutup">×</button>
      <div class="code" style="color:var(--red)">${esc(d.kode)}</div><h2 style="font-size:1.3rem;margin-top:6px">${esc(d.judul)}</h2><span class="badge ${s[1]}">${s[0]}</span>
      <dl class="kv"><dt>Kategori</dt><dd>${esc(katNama(d.kat))}</dd><dt>Penanggung jawab</dt><dd>${esc(d.pemilik)}</dd><dt>Tanggal terbit</dt><dd>${tgl(d.terbit)}</dd><dt>Berlaku sampai</dt><dd>${d.sampai ? tgl(d.sampai) : 'Tidak terbatas'}</dd><dt>Masa simpan</dt><dd>${esc((KAT.find(k => k[0] === d.kat) || [])[3])}</dd><dt>Akses</dt><dd>${d.kat === 'ASM' || d.kat === 'ASR' ? 'Terbatas: Sekretariat, Sertifikasi, Manajemen Mutu' : 'Seluruh petugas LSP'}</dd></dl>
      <div class="file"><i>PDF</i><div><b>${esc(d.berkas)}</b><div class="muted" style="font-size:.82rem">Berkas contoh — pada versi akhir tersimpan di Drive LSP</div></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px"><button class="btn ghost" data-a="Unduhan dicatat (demo)">Unduh</button><button class="btn ghost" data-a="Formulir revisi dibuka (demo)">Unggah revisi</button></div>
      <h3>Riwayat revisi</h3><div class="ver">${vers}</div></div></div>`);
    const back = document.querySelector('.drawer-back');
    back.addEventListener('click', (e) => { const a = e.target.closest('[data-a]'); if (a) toast(a.dataset.a); if (e.target === back || e.target.closest('.x')) back.remove(); });
  }

  function form() {
    document.body.insertAdjacentHTML('beforeend', `<div class="drawer-back"><div class="drawer" role="dialog" aria-modal="true"><button class="x" aria-label="Tutup">×</button><h2>Catat dokumen</h2>
      <form class="form" id="fD"><label class="f">Kategori<select name="kat">${KAT.map(k => `<option value="${k[0]}">${esc(k[1])}</option>`).join('')}</select></label>
      <label class="f">Judul dokumen<input name="judul" required placeholder="mis. Berita Acara Asesmen Skema Web Developer"></label>
      <div class="row2"><label class="f">Tanggal terbit<input type="date" name="terbit" value="${HARI_INI}"></label><label class="f">Berlaku sampai (opsional)<input type="date" name="sampai"></label></div>
      <div class="row2"><label class="f">Penanggung jawab<select name="pemilik"><option>Sekretariat</option><option>Administrasi</option><option>Sertifikasi</option><option>Manajemen Mutu</option><option>Skema</option></select></label><label class="f">Status<select name="status"><option>Berlaku</option><option>Draf</option></select></label></div>
      <label class="f">Berkas (PDF)<input type="file" accept=".pdf"></label>
      <p class="note" id="noPrev"></p><div><button class="btn" type="submit">Simpan dokumen</button></div></form></div></div>`);
    const back = document.querySelector('.drawer-back'), f = document.getElementById('fD');
    const prev = () => { const k = f.kat.value, y = (f.terbit.value || HARI_INI).slice(0, 4); document.getElementById('noPrev').textContent = 'Nomor otomatis: LSP-UNIMED/' + k + '/' + String((seq[k] || 0) + 1).padStart(3, '0') + '/' + y; };
    f.kat.onchange = prev; f.terbit.onchange = prev; prev();
    back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('.x')) back.remove(); });
    f.onsubmit = (e) => {
      e.preventDefault(); const k = f.kat.value; seq[k] = (seq[k] || 0) + 1;
      const d = { id: DOCS.length + 1, kode: `LSP-UNIMED/${k}/${String(seq[k]).padStart(3, '0')}/${(f.terbit.value || HARI_INI).slice(0, 4)}`, kat: k, judul: f.judul.value.trim(), pemilik: f.pemilik.value, terbit: f.terbit.value, sampai: f.sampai.value, status: f.status.value, rev: 1, berkas: 'berkas_baru.pdf' };
      DOCS.push(d); LOG.unshift([HARI_INI + ' ' + new Date().toTimeString().slice(0, 5), 'Sekretariat', 'Mencatat ' + d.judul]);
      back.remove(); toast('Dokumen tersimpan: ' + d.kode + ' (demo, tidak permanen)'); shell(); VIEW = 'dokumen'; FK = k; render();
    };
  }

  login();
})();
</script>
</body>
</html>
