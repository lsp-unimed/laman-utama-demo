  const romawi = (n) => ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'][n - 1];

    ['MUT', 'SOP Penanganan Banding', 'Manajemen Mutu', '2025-02-01', '', 'Berlaku', 2],
    ['MUT', 'SOP Penanganan Keluhan', 'Manajemen Mutu', '2025-02-01', '', 'Berlaku', 2],

    ['MUT', 'Formulir FR.APL.02 Asesmen Mandiri', 'Sertifikasi', '2026-08-01', '', 'Berlaku', 2],

    ['SKM', 'Skema Kualifikasi IV Teknik Sepeda Motor', 'Skema', '2026-07-20', '', 'Berlaku', 1],
    ['SKM', 'Skema Klaster Penyediaan Makanan di Institusi', 'Skema', '2026-07-20', '', 'Berlaku', 1],
    ['SKM', 'MUK Okupasi Web Developer', 'Skema', '2026-10-03', '', 'Berlaku', 1],
    ['SKM', 'MUK Okupasi Welding Inspector Standard', 'Skema', '2026-10-03', '', 'Draf', 1],
    ['ASR', 'Sertifikat Asesor — Ali Akbar Lubis (MET 000.000687 2023)', 'Sertifikasi', '2023-11-02', '2026-11-02', 'Berlaku', 1],
    ['ASR', 'Sertifikat Asesor — Tuti Sriwedari (MET 000.000989 2021)', 'Sertifikasi', '2021-12-01', '2026-12-01', 'Berlaku', 1],
    ['ASR', 'Sertifikat Asesor — Hanapi Hasan (MET 000.000689 2023)', 'Sertifikasi', '2023-11-02', '2026-11-02', 'Berlaku', 1],
    ['ASR', 'SK Ketua LSP tentang Penugasan Asesor Kompetensi pada Uji Kompetensi Tanggal 17 Oktober 2026', 'Sekretariat', '2026-10-05', '', 'Berlaku', 1, { surat: 1, alur: 'Disahkan', kode: '072/LSP-UNIMED/SK/X/2026', tpl: { id: 'sk', data: { tanggal: '2026-10-05' } } }],
    ['ASR', 'Surat Tugas — Melaksanakan asesmen uji kompetensi skema Okupasi Web Developer yang disaksikan', 'Sekretariat', '2026-10-08', '', 'Draf', 1, { surat: 1, alur: 'Diajukan', kode: '073/LSP-UNIMED/ST/X/2026', tpl: { id: 'tugas', data: { tanggal: '2026-10-08' } } }],
    ['ASR', 'Pakta Integritas & Kerahasiaan Asesor 2026', 'Manajemen Mutu', '2026-10-05', '', 'Berlaku', 1],
    ['TUK', 'SK Penetapan 12 TUK LSP UNIMED', 'Sekretariat', '2026-09-15', '2027-09-15', 'Berlaku', 1],
    ['TUK', 'Berita Acara Verifikasi TUK Otomotif', 'Sertifikasi', '2026-09-12', '2027-09-12', 'Berlaku', 1],
    ['TUK', 'Berita Acara Verifikasi TUK Welding', 'Sertifikasi', '2026-09-12', '2027-09-12', 'Berlaku', 1],
    ['TUK', 'Daftar Peralatan TUK Multimedia dan Pemrograman', 'Sertifikasi', '2026-09-12', '', 'Berlaku', 1],
    ['ASM', 'Daftar Hadir Uji Kompetensi 17 Oktober 2026', 'Sekretariat', '', '', 'Draf', 1],
    ['ASM', 'Berita Acara Asesmen 17 Oktober 2026', 'Sertifikasi', '', '', 'Draf', 1],
    ['MNJ', 'Notulen Kaji Ulang Manajemen 2025', 'Manajemen Mutu', '2025-12-18', '', 'Berlaku', 1],
    ['MNJ', 'Laporan Audit Internal 2026', 'Manajemen Mutu', '2026-09-28', '', 'Draf', 1],
    ['MNJ', 'Undangan Rapat Persiapan Penyaksian BNSP', 'Sekretariat', '2026-09-29', '', 'Berlaku', 1, { surat: 1, alur: 'Terkirim', kode: '068/LSP-UNIMED/UND/IX/2026', tpl: { id: 'undangan', data: { tanggal: '2026-09-29', tglAcara: '2026-10-01' } } }],
    ['MNJ', 'Notulen Rapat Persiapan Penyaksian BNSP', 'Sekretariat', '2026-10-01', '', 'Berlaku', 1, { tpl: { id: 'notulen', data: { tanggal: '2026-10-01' } } }],
    ['KOR', 'Penyampaian Daftar Asesor dan TUK kepada BNSP', 'Sekretariat', '2026-10-02', '', 'Berlaku', 1, { surat: 1, alur: 'Terkirim', kode: '071/LSP-UNIMED/PB/X/2026' }],
    ['MNJ', 'Undangan Rapat Pleno Hasil Uji Kompetensi', 'Sekretariat', '2026-10-09', '', 'Draf', 1, { surat: 1, alur: 'Draf', kode: '074/LSP-UNIMED/UND/X/2026', tpl: { id: 'undangan', data: { tanggal: '2026-10-09', perihal: 'Undangan Rapat Pleno Hasil Uji Kompetensi', tglAcara: '2026-10-20', pembuka: 'Sehubungan dengan telah dilaksanakannya uji kompetensi pada 17 Oktober 2026, kami mengundang Bapak/Ibu untuk hadir pada rapat pleno penetapan hasil uji kompetensi yang akan dilaksanakan pada:', acara: 'Laporan pelaksanaan uji kompetensi\nPenetapan keputusan sertifikasi\nTindak lanjut temuan penyaksian BNSP' } } }]
  ];
  const seq = { SURAT: 74, SM: 43 };
  let DOCS = D.map((d, i) => {
    const x = d[7] || {}, y = (d[3] || HARI_INI).slice(0, 4);
    if (!x.kode) seq[d[0]] = (seq[d[0]] || 0) + 1;
    return Object.assign({ id: i + 1, kode: x.kode || `LSP-UNIMED/${d[0]}/${pad(seq[d[0]])}/${y}`, kat: d[0], judul: d[1], pemilik: d[2], terbit: d[3], sampai: d[4], status: d[5], rev: d[6],
      berkas: d[1].replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.pdf' }, x.surat ? { surat: true, alur: x.alur } : {}, x.tpl ? { tpl: x.tpl } : {});
  });

  // Surat masuk
  let SM = [
    ['SM-038/2026', '2026-09-08', '2026-09-09', 'Biro Akademik UNIMED', '1520/UN33.1/KM/2026', 'Permohonan data lulusan bersertifikat kompetensi', 'Biasa', 'Selesai', [['2026-09-09', ['Bidang Sertifikasi'], 'Siapkan jawaban', 'Kirim rekap pemegang sertifikat 2024–2026', '2026-09-16']]],
    ['SM-039/2026', '2026-09-12', '2026-09-15', 'Fakultas Teknik UNIMED', '0871/UN33.5/DT/2026', 'Usulan peserta uji kompetensi skema Teknik Sepeda Motor', 'Biasa', 'Selesai', [['2026-09-15', ['Administrasi', 'Bidang Sertifikasi'], 'Tindak lanjuti', 'Masukkan ke jadwal 17 Oktober bila kuota tersedia', '2026-09-30']]],
    ['SM-040/2026', '2026-09-18', '2026-09-20', 'Badan Nasional Sertifikasi Profesi', 'Surat BNSP (contoh)', 'Jadwal penyaksian (witness) uji kompetensi LSP UNIMED', 'Segera', 'Didisposisi', [['2026-09-20', ['Sekretariat', 'Bidang Sertifikasi', 'Manajemen Mutu'], 'Tindak lanjuti', 'Siapkan seluruh dokumen dan rapat persiapan', '2026-10-15']]],
    ['SM-041/2026', '2026-09-24', '2026-09-25', 'PT Mitra Industri Sumatera (contoh)', '045/MIS/IX/2026', 'Permohonan kerja sama sertifikasi kompetensi karyawan', 'Biasa', 'Didisposisi', [['2026-09-26', ['Sekretariat'], 'Pelajari dan beri saran', 'Telaah skema yang relevan', '2026-10-12']]],
    ['SM-042/2026', '2026-10-05', '2026-10-06', 'Fakultas Ekonomi UNIMED', '0533/UN33.7/DT/2026', 'Permohonan jadwal uji kompetensi skema bidang akuntansi', 'Biasa', 'Diterima', []],
    ['SM-043/2026', '2026-10-08', '2026-10-08', 'Rektorat UNIMED', '2210/UN33/KP/2026', 'Undangan rapat koordinasi unit layanan universitas', 'Sangat segera', 'Diterima', []]
  ].map((r, i) => ({ id: i + 1, agenda: r[0], tglSurat: r[1], terima: r[2], asal: r[3], nomor: r[4], perihal: r[5], sifat: r[6], status: r[7], disp: r[8].map(x => ({ tgl: x[0], ke: x[1], instruksi: x[2], catatan: x[3], batas: x[4] })), berkas: 'Pindaian_' + r[0].replace(/\W+/g, '_') + '.pdf' }));

  const status = (d) => {
    if (d.status === 'Draf') return ['Draf', 'draft'];
    if (d.sampai) { const h = hari(d.sampai); if (h < 0) return ['Kedaluwarsa', 'bad']; if (h <= 60) return ['Segera berakhir', 'warn']; }
    return ['Berlaku', 'ok'];
  };
  const ALUR = ['Draf', 'Diajukan', 'Disahkan', 'Terkirim'];
  const alurB = { Draf: 'draft', Diajukan: 'warn', Disahkan: 'ok', Terkirim: 'info' };
  const smB = { Diterima: 'warn', Didisposisi: 'info', Selesai: 'ok' };
  const LOG = [
    ['2026-10-09 15:42', 'Sekretariat', 'Mengunggah revisi 9 Daftar Induk Dokumen'],
    ['2026-10-09 10:05', 'Sekretariat', 'Membuat draf 074/LSP-UNIMED/UND/X/2026 dari templat'],
    ['2026-10-08 14:20', 'Sekretariat', 'Mengajukan pengesahan 073/LSP-UNIMED/ST/X/2026'],
    ['2026-10-08 09:12', 'Sekretariat', 'Mencatat surat masuk SM-043/2026'],
    ['2026-10-05 10:18', 'Ketua LSP', 'Mengesahkan 072/LSP-UNIMED/SK/X/2026'],
    ['2026-10-03 14:05', 'Skema', 'Mencatat MUK Okupasi Web Developer'],
    ['2026-09-28 16:11', 'Manajemen Mutu', 'Menyimpan draf Laporan Audit Internal 2026']
  ];
  const catat = (m, siapa) => LOG.unshift([jam(), siapa || 'Sekretariat', m]);

  /* ---------- Kesiapan penyaksian / audit ---------- */
  const AUDIT = [
    ['Panduan mutu dan daftar induk dokumen', 'ok', 'Revisi terbaru 30 Sep 2026'],
    ['SK pendirian dan SK pengurus LSP', 'ok', 'Lengkap'],
    ['Lisensi BNSP', 'bad', 'Masa berlaku berakhir 6 Apr 2026 — lampirkan bukti proses perpanjangan'],
    ['Dokumen skema (16 skema)', 'ok', '16 dari 16 tercatat'],
    ['MUK per skema', 'warn', '12 dari 16 disahkan, 4 masih draf'],
    ['Sertifikat asesor aktif (16 asesor)', 'warn', '16 tercatat, 3 berakhir dalam 60 hari'],
    ['Verifikasi TUK (12 TUK)', 'ok', '12 berita acara tercatat'],
    ['SK penugasan asesor & pakta integritas', 'ok', 'SK 072/LSP-UNIMED/SK/X/2026 disahkan'],
    ['Surat tugas asesor 17 Okt 2026', 'warn', 'Menunggu pengesahan Ketua'],
    ['Rekaman asesmen 17 Okt 2026', 'warn', 'Diisi setelah uji kompetensi berlangsung'],
    ['Audit internal & kaji ulang manajemen', 'warn', 'Audit internal 2026 masih draf']
  ];

  /* ---------- Util tampilan ---------- */
  const app = document.getElementById('app');
  let VIEW = 'ringkasan', FK = '';
  const FL = {}; // filter per tampilan: { q, st, dari, sampai, pg }
  const fl = () => (FL[VIEW + FK] = FL[VIEW + FK] || { q: '', st: '', dari: '', sampai: '', pg: 1 });
  const toast = (m) => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); };
  const htmlDok = (d) => d.tpl ? window.susunDokumen(d.tpl.id, d.tpl.data, d.kode, HARI_INI) : '';
  const drawer = (inner) => {
    document.body.insertAdjacentHTML('beforeend', `<div class="drawer-back"><div class="drawer" role="dialog" aria-modal="true"><button class="x" aria-label="Tutup">×</button>${inner}</div></div>`);
    const back = document.body.lastElementChild;
    back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('.x')) back.remove(); });
    return back;
  };
  const tutupDrawer = () => document.querySelectorAll('.drawer-back').forEach(x => x.remove());
  const dalamRentang = (s, f) => (!f.dari || (s && s >= f.dari)) && (!f.sampai || (s && s <= f.sampai));

  // Toolbar standar: cari, status, rentang tanggal, ekspor
  const toolbar = (f, opsiStatus, ph, extra) => `<div class="toolbar">
      <input id="q" type="search" placeholder="${esc(ph)}" value="${esc(f.q)}">
      <select id="fs"><option value="">Semua status</option>${opsiStatus.map(s => `<option ${f.st === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <label class="dt">Dari<input type="date" id="fd" value="${f.dari}"></label><label class="dt">Sampai<input type="date" id="fe" value="${f.sampai}"></label>
      <button class="btn ghost" id="ex" type="button">Ekspor Excel</button>${extra || ''}</div>`;
  const ikatToolbar = (f, draw) => {
    const set = (k) => (e) => { f[k] = e.target.value; f.pg = 1; draw(); };
    document.getElementById('q').oninput = set('q'); document.getElementById('fs').onchange = set('st');
    document.getElementById('fd').onchange = set('dari'); document.getElementById('fe').onchange = set('sampai');
  };
  const pager = (total, f, draw) => {
    const n = Math.max(1, Math.ceil(total / PER)); if (f.pg > n) f.pg = n;
    const el = document.getElementById('pg');
    el.innerHTML = total ? `<span>${(f.pg - 1) * PER + 1}–${Math.min(total, f.pg * PER)} dari ${total}</span><span class="pgb"><button type="button" data-p="-1" ${f.pg <= 1 ? 'disabled' : ''}>‹ Sebelumnya</button><b>${f.pg} / ${n}</b><button type="button" data-p="1" ${f.pg >= n ? 'disabled' : ''}>Berikutnya ›</button></span>` : '';
    el.onclick = (e) => { const b = e.target.closest('[data-p]'); if (b) { f.pg += +b.dataset.p; draw(); } };
  };
  const halaman = (list, f) => list.slice((f.pg - 1) * PER, f.pg * PER);
  // CSV yang aman dibuka di Excel: BOM UTF-8, pemisah titik koma, rumus dinetralkan
  const unduhCSV = (nama, head, rows) => {
    const sel = (v) => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const txt = '﻿' + [head, ...rows].map(r => r.map(sel).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = nama + '-' + HARI_INI + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Ekspor ' + rows.length + ' baris — berkas dapat dibuka di Excel');
  };

  /* ---------- Login & kerangka ---------- */
  function login() {
    app.innerHTML = `<div class="login"><div class="art"><div><h1>Arsip dokumen LSP UNIMED</h1><p>Ruang kerja petugas untuk membuat, mencatat, menyimpan, dan menemukan kembali seluruh dokumen lembaga — dari surat undangan sampai berita acara asesmen.</p>
      <ul><li>Buat surat dan dokumen dari templat berkop, nomor otomatis</li><li>Atau unggah berkas yang sudah jadi</li><li>Surat masuk dengan disposisi, surat keluar dengan alur pengesahan</li><li>Riwayat revisi, pengingat masa berlaku, dan kesiapan penyaksian BNSP</li></ul></div><p style="font-size:.85rem">Akses khusus petugas LSP. Login memakai akun yang sama dengan panel admin SIPINTAR.</p></div>
      <form id="fL"><img src="../assets/img/logo-lsp.png" alt="LSP UNIMED"><h2>Masuk petugas</h2><label class="f">Username<input value="sekretariat" autocomplete="username"></label><label class="f">Password<input type="password" value="demo" autocomplete="current-password"></label><button class="btn" type="submit">Masuk</button><p class="muted" style="font-size:.84rem;margin:0">Demo: tekan Masuk, isian tidak diperiksa.</p><a href="../index.html" style="font-size:.88rem">Kembali ke situs LSP</a></form></div>`;
    document.getElementById('fL').onsubmit = (e) => { e.preventDefault(); shell(); };
  }

  function shell() {
    const n = (k) => DOCS.filter(d => d.kat === k).length;
    const reminders = DOCS.filter(d => ['warn', 'bad'].includes(status(d)[1])).length;
    const smBuka = SM.filter(s => s.status !== 'Selesai').length, skTunggu = DOCS.filter(d => d.surat && d.alur === 'Diajukan').length;
    app.innerHTML = `<div class="shell"><aside class="side" id="side">
      <div class="brand"><img src="../assets/img/logo-lsp.png" alt=""><div><b>Arsip Dokumen</b><span>LSP UNIMED</span></div></div>
      <button data-v="ringkasan">Ringkasan</button>
      <button data-v="dokumen" data-k="">Semua dokumen <span class="n">${DOCS.length}</span></button>
      <button data-v="pengingat">Pengingat <span class="n">${reminders}</span></button>
      <button data-v="audit">Kesiapan penyaksian</button>
      <div class="grp">Persuratan</div>
      <button data-v="masuk">Surat masuk <span class="n${smBuka ? ' hot' : ''}">${smBuka}</span></button>
      <button data-v="keluar">Surat keluar <span class="n${skTunggu ? ' hot' : ''}">${skTunggu}</span></button>
      <button data-v="templat">Templat dokumen</button>
      <div class="grp">Kategori</div>
      ${KAT.map(k => `<button data-v="dokumen" data-k="${k[0]}">${esc(k[1])} <span class="n">${n(k[0])}</span></button>`).join('')}
      <div class="grp">Lainnya</div>
      <button data-v="aktivitas">Riwayat aktivitas</button>
      <button data-v="pengguna">Pengguna & hak akses</button>
      <div class="foot">Masuk sebagai <b style="color:#fff">Sekretariat LSP</b><br><a href="#" id="out">Keluar</a> · <a href="../index.html">Situs LSP</a></div>
    </aside><div class="main"><div class="top"><div style="display:flex;gap:10px;align-items:center;min-width:0"><button class="menu" id="menu" aria-label="Menu">☰</button><h1 id="title" style="margin:0"></h1></div><button class="btn" id="add">+ Dokumen baru</button></div><div id="view"></div></div></div>`;
    document.getElementById('side').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-v]'); if (!b) return;
      VIEW = b.dataset.v; FK = b.dataset.k || ''; document.body.classList.remove('nav-open'); render(); window.scrollTo(0, 0);
    });
    document.getElementById('menu').onclick = () => document.body.classList.toggle('nav-open');
    document.getElementById('out').onclick = (e) => { e.preventDefault(); login(); };
    document.getElementById('add').onclick = () => pilih();
    render();
  }
  const pergi = (v, k) => { VIEW = v; FK = k || ''; shell(); };

  function render() {
    document.querySelectorAll('.side button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW && (VIEW !== 'dokumen' || (b.dataset.k || '') === FK)));
    const v = document.getElementById('view'), T = document.getElementById('title');

    v.querySelectorAll('[data-t]').forEach(b => b.onclick = () => window.bukaTemplat(b.dataset.t, API));
    const fk = document.getElementById('fKop');
    fk.onsubmit = (e) => { e.preventDefault(); Array.from(fk.elements).forEach(x => { if (x.name) K[x.name] = x.value.trim(); }); catat('Mengubah pengaturan kop surat'); toast('Pengaturan kop surat disimpan'); };
  }

  function vAktivitas(v, T) {
    T.textContent = 'Riwayat aktivitas';
    v.innerHTML = `<p class="muted lead">Setiap pembuatan, pencatatan, pengesahan, disposisi, dan pengunduhan dokumen tercatat dan tidak dapat diubah.</p><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Petugas</th><th>Aktivitas</th></tr></thead><tbody>${LOG.map(l => `<tr><td data-l="Waktu" style="white-space:nowrap">${esc(l[0])}</td><td data-l="Petugas">${esc(l[1])}</td><td data-l="Aktivitas">${esc(l[2])}</td></tr>`).join('')}</tbody></table></div>`;
  }

  function vPengguna(v, T) {
    T.textContent = 'Pengguna & hak akses';
    const R = [
      ['Ketua LSP', 'Semua kategori', 'Ya', 'Ya', 'Ya'],
      ['Admin', 'Semua kategori', 'Ya', 'Tidak', 'Ya'],
      ['Sekretariat', 'Semua kategori', 'Ya', 'Tidak', 'Ya'],
      ['Manajemen Mutu', 'Mutu, rapat & manajemen, asesor', 'Ya', 'Tidak', 'Tidak'],
      ['Bidang Sertifikasi', 'Asesor, tempat uji, rekaman asesmen', 'Ya', 'Tidak', 'Tidak'],
      ['Bidang Skema', 'Skema & MUK', 'Ya', 'Tidak', 'Tidak'],
      ['Administrasi', 'Surat-menyurat, rekaman asesmen', 'Ya', 'Tidak', 'Tidak']
    ];
    v.innerHTML = `<p class="muted lead">Akun sama dengan panel admin SIPINTAR, sehingga petugas cukup punya satu username. Penambahan akun dan reset kata sandi dilakukan Admin di SIPINTAR → Pengguna.</p>
      <div class="table-wrap"><table><thead><tr><th>Peran</th><th>Kategori yang dapat diubah</th><th>Buat & unggah</th><th>Sahkan surat</th><th>Ubah kop & templat</th></tr></thead><tbody>${R.map(r => `<tr><td data-l="Peran"><b>${r[0]}</b></td><td data-l="Kategori">${r[1]}</td><td data-l="Buat & unggah">${r[2]}</td><td data-l="Sahkan surat">${r[3]}</td><td data-l="Ubah kop">${r[4]}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:.86rem;margin-top:12px">Semua peran dapat melihat dan mengunduh dokumen kategori umum. Kategori asesor dan rekaman asesmen hanya terbuka untuk Sekretariat, Sertifikasi, dan Manajemen Mutu.</p>`;
  }

  /* ---------- Detail dokumen / surat keluar ---------- */
  function detail(id) {
    tutupDrawer();
    const d = DOCS.find(x => x.id === id), s = status(d);
    const vers = Array.from({ length: d.rev }, (_, i) => d.rev - i).map(r => `<div><b>Revisi ${r}${r === d.rev ? ' (berlaku)' : ''}</b><span class="muted">${r === d.rev ? tgl(d.terbit || HARI_INI) : 'Diganti oleh revisi ' + (r + 1)}</span></div>`).join('');
    let aksi = '';
    if (d.surat) {
      const i = ALUR.indexOf(d.alur);
      aksi = { Draf: (d.tpl ? '<button class="btn ghost" data-a="ubah">Ubah draf</button>' : '') + '<button class="btn" data-a="ajukan">Ajukan pengesahan</button>',
        Diajukan: '<button class="btn" data-a="sahkan">Sahkan (Ketua)</button><button class="btn ghost" data-a="kembali">Kembalikan ke draf</button>',
        Disahkan: '<button class="btn" data-a="kirim">Tandai terkirim</button><button class="btn ghost" data-a="Unggah pindaian bertanda tangan (demo)">Unggah versi bertanda tangan</button>', Terkirim: '' }[d.alur];
      aksi = `<div class="steps">${ALUR.map((x, j) => `<div class="${i >= j ? 'on' : ''}">${x === 'Disahkan' ? 'Disahkan Ketua' : x}</div>`).join('')}</div>${aksi ? `<div class="acts">${aksi}</div>` : ''}${d.alur === 'Diajukan' ? '<p class="muted" style="font-size:.82rem;margin-top:-8px">Pada versi akhir tombol Sahkan hanya tampil untuk akun Ketua LSP; Ketua menerima pemberitahuan saat ada surat diajukan.</p>' : ''}`;
    } else if (d.tpl && d.status === 'Draf') aksi = '<div class="acts"><button class="btn ghost" data-a="ubah">Ubah draf</button></div>';
    const back = drawer(`<div class="code" style="color:var(--red)">${esc(d.kode)}</div><h2 style="font-size:1.25rem;margin-top:6px">${esc(d.judul)}</h2>${d.surat ? `<span class="badge ${alurB[d.alur]}">${d.alur}</span>` : `<span class="badge ${s[1]}">${s[0]}</span>`}
      ${aksi}
      <dl class="kv"><dt>Kategori</dt><dd>${esc(katNama(d.kat))}</dd><dt>Penanggung jawab</dt><dd>${esc(d.pemilik)}</dd><dt>Tanggal</dt><dd>${tgl(d.terbit)}</dd><dt>Berlaku sampai</dt><dd>${d.sampai ? tgl(d.sampai) : 'Tidak terbatas'}</dd><dt>Sumber</dt><dd>${d.tpl ? 'Dibuat dari templat ' + esc((window.TEMPLAT.find(t => t.id === d.tpl.id) || {}).nama || '') : 'Berkas diunggah'}</dd><dt>Masa simpan</dt><dd>${esc((KAT.find(k => k[0] === d.kat) || [])[3])}</dd><dt>Akses</dt><dd>${d.kat === 'ASM' || d.kat === 'ASR' ? 'Terbatas: Sekretariat, Sertifikasi, Manajemen Mutu' : 'Seluruh petugas LSP'}</dd></dl>
      <div class="file"><i>PDF</i><div><b>${esc(d.berkas)}</b><div class="muted" style="font-size:.82rem">${d.tpl ? 'PDF disusun otomatis dari templat' : 'Berkas contoh — pada versi akhir tersimpan di Drive LSP'}</div></div></div>
      <div class="acts">${d.tpl ? '<button class="btn" data-a="lihat">Lihat & cetak</button>' : ''}<button class="btn ghost" data-a="Unduhan dicatat (demo)">Unduh</button><button class="btn ghost" data-a="Formulir revisi dibuka (demo)">Unggah revisi</button></div>
      ${d.tpl ? `<h3>Pratinjau</h3><div class="mini"><div class="kertas">${htmlDok(d)}</div></div>` : ''}
      <h3 style="margin-top:16px">Riwayat revisi</h3><div class="ver">${vers}</div>`);
    const mini = back.querySelector('.mini');
    if (mini) { const k = mini.firstElementChild, sc = () => { const r = mini.clientWidth / k.offsetWidth; k.style.transform = `scale(${r})`; mini.style.height = Math.min(k.offsetHeight * r, 520) + 'px'; }; requestAnimationFrame(sc); }
    back.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]'); if (!a) return;
      const act = a.dataset.a, ubahAlur = (al, pesan, siapa) => { d.alur = al; d.status = al === 'Disahkan' || al === 'Terkirim' ? 'Berlaku' : 'Draf'; catat(pesan + ' ' + d.kode, siapa); toast(pesan + ' ' + d.kode); shell(); detail(id); };
      if (act === 'lihat') window.cetakDokumen(htmlDok(d), d.judul);
      else if (act === 'ubah') { tutupDrawer(); window.bukaTemplat(d.tpl.id, API, { id: d.id, kat: d.kat, nomor: d.kode, data: d.tpl.data }); }
      else if (act === 'ajukan') ubahAlur('Diajukan', 'Mengajukan pengesahan');
      else if (act === 'kembali') ubahAlur('Draf', 'Mengembalikan ke draf', 'Ketua LSP');
      else if (act === 'sahkan') ubahAlur('Disahkan', 'Mengesahkan', 'Ketua LSP');
      else if (act === 'kirim') ubahAlur('Terkirim', 'Menandai terkirim');
      else toast(act);
    });
  }

  /* ---------- Dokumen baru: pilih cara ---------- */
  function pilih(hanyaSurat) {
    tutupDrawer();
    const tp = window.TEMPLAT.filter(t => !hanyaSurat || t.surat);
    const back = drawer(`<h2>${hanyaSurat ? 'Buat surat keluar' : 'Dokumen baru'}</h2><p class="muted">Pilih cara mencatat dokumen.</p>
      <div class="choice"><button type="button" data-c="templat" class="on"><b>Buat di web dari templat</b><span>Isi formulir singkat; sistem menyusun dokumen lengkap dengan kop surat, nomor otomatis, dan tanda tangan. Siap dicetak atau disimpan PDF.</span></button>
      <button type="button" data-c="unggah"><b>Unggah berkas</b><span>Dokumen sudah jadi (PDF hasil pindai atau dari aplikasi lain). Sistem memberi nomor register dan menyimpan berkasnya.</span></button>
      ${hanyaSurat ? '' : '<button type="button" data-c="masuk"><b>Catat surat masuk</b><span>Surat dari pihak lain: beri nomor agenda, unggah pindaian, lalu disposisikan.</span></button>'}</div>
      <h3 style="margin-top:18px" id="tplH">Pilih templat</h3><ul class="list">${tp.map(t => `<li><span><b>${esc(t.nama)}</b> <span class="chip">${t.surat ? 'surat' : 'dokumen'}</span><br><span class="muted" style="font-size:.84rem">${esc(t.ket)}</span></span><button class="btn ghost" type="button" data-t="${t.id}">Gunakan</button></li>`).join('')}</ul>`);
    back.addEventListener('click', (e) => {
      const c = e.target.closest('[data-c]'), t = e.target.closest('[data-t]');
      if (c && c.dataset.c === 'unggah') { tutupDrawer(); form(hanyaSurat); }
      else if (c && c.dataset.c === 'masuk') formMasuk();
      else if (c) back.querySelector('#tplH').scrollIntoView({ behavior: 'smooth' });
      else if (t) { tutupDrawer(); window.bukaTemplat(t.dataset.t, API); }
    });
  }

  /* Jembatan untuk editor templat (templat.js) */
  const API = {
    hariIni: HARI_INI, KAT,
    nomorSurat(kode, t) { t = t || HARI_INI; return `${pad(seq.SURAT + 1)}/LSP-UNIMED/${kode}/${romawi(+t.slice(5, 7))}/${t.slice(0, 4)}`; },
    nomorDok(k) { return `LSP-UNIMED/${k}/${pad((seq[k] || 0) + 1)}/${HARI_INI.slice(0, 4)}`; },
    simpan(o) {
      const stt = o.surat ? (o.alur === 'Disahkan' ? 'Berlaku' : 'Draf') : (o.alur === 'Berlaku' ? 'Berlaku' : 'Draf');
      let d;
      if (o.id) {
        d = DOCS.find(x => x.id === o.id);
        Object.assign(d, { judul: o.judul, kat: o.kat, tpl: o.tpl, terbit: o.tanggal, status: stt }); if (d.surat) d.alur = o.alur === 'Diajukan' ? 'Diajukan' : 'Draf';
        catat((d.alur === 'Diajukan' ? 'Mengajukan pengesahan ' : 'Memperbarui draf ') + d.kode);
      } else {
        if (o.surat) seq.SURAT++; else seq[o.kat] = (seq[o.kat] || 0) + 1;
        d = { id: DOCS.length + 1, kode: o.nomor, kat: o.kat, judul: o.judul, pemilik: 'Sekretariat', terbit: o.tanggal || HARI_INI, sampai: '', status: stt, rev: 1, berkas: o.judul.replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.pdf', tpl: o.tpl };
        if (o.surat) { d.surat = true; d.alur = o.alur; }
        DOCS.push(d); catat('Membuat ' + o.jenis.toLowerCase() + ' ' + d.kode + ' dari templat');
      }
      toast((d.surat ? (d.alur === 'Diajukan' ? 'Diajukan ke Ketua: ' : 'Draf tersimpan: ') : (stt === 'Berlaku' ? 'Diarsipkan: ' : 'Draf tersimpan: ')) + d.kode);
      if (d.surat) pergi('keluar'); else pergi('dokumen', d.kat);
      detail(d.id);
    }
  };

  /* ---------- Unggah berkas ---------- */
  function form(surat) {
    const back = drawer(`<h2>Unggah berkas</h2>
      <form class="form" id="fD">${surat ? '' : `<label class="f">Jenis<select name="jenis"><option value="dok">Dokumen (register LSP-UNIMED/kategori)</option><option value="surat">Surat keluar (nomor dari buku agenda)</option></select></label>`}
      <label class="f">Kategori arsip<select name="kat">${KAT.map(k => `<option value="${k[0]}"${surat && k[0] === 'KOR' ? ' selected' : ''}>${esc(k[1])}</option>`).join('')}</select></label>
      <label class="f">Judul / perihal<input name="judul" required placeholder="mis. Berita Acara Asesmen Skema Web Developer"></label>
      <label class="f" id="kodeJ" hidden>Kode jenis surat<input name="kj" value="PB" maxlength="5"><small class="muted" style="font-weight:400">mis. UND undangan, ST surat tugas, SK keputusan, PB pemberitahuan</small></label>
      <div class="row2"><label class="f">Tanggal<input type="date" name="terbit" value="${HARI_INI}"></label><label class="f">Berlaku sampai (opsional)<input type="date" name="sampai"></label></div>
      <div class="row2"><label class="f">Penanggung jawab<select name="pemilik"><option>Sekretariat</option><option>Administrasi</option><option>Sertifikasi</option><option>Manajemen Mutu</option><option>Skema</option></select></label><label class="f">Status<select name="status"><option>Berlaku</option><option>Draf</option></select></label></div>
      <label class="f">Berkas (PDF, DOCX, XLSX, JPG)<input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></label>
      <p class="note" id="noPrev"></p><div><button class="btn" type="submit">Simpan dokumen</button></div></form>`);
    const f = back.querySelector('#fD');
    const isSurat = () => surat || (f.jenis && f.jenis.value === 'surat');
    const nomor = () => isSurat() ? API.nomorSurat((f.kj.value || 'PB').toUpperCase().replace(/[^A-Z]/g, ''), f.terbit.value) : `LSP-UNIMED/${f.kat.value}/${pad((seq[f.kat.value] || 0) + 1)}/${(f.terbit.value || HARI_INI).slice(0, 4)}`;
    const prev = () => { back.querySelector('#kodeJ').hidden = !isSurat(); back.querySelector('#noPrev').textContent = 'Nomor otomatis: ' + nomor(); };
    f.addEventListener('input', prev); f.addEventListener('change', prev); prev();
    f.onsubmit = (e) => {
      e.preventDefault(); const k = f.kat.value, no = nomor(), sr = isSurat();
      if (sr) seq.SURAT++; else seq[k] = (seq[k] || 0) + 1;
      const d = { id: DOCS.length + 1, kode: no, kat: k, judul: f.judul.value.trim(), pemilik: f.pemilik.value, terbit: f.terbit.value, sampai: f.sampai.value, status: f.status.value, rev: 1, berkas: 'berkas_baru.pdf' };
      if (sr) { d.surat = true; d.alur = f.status.value === 'Berlaku' ? 'Disahkan' : 'Draf'; }
      DOCS.push(d); catat('Mengunggah ' + d.judul);
      tutupDrawer(); toast('Dokumen tersimpan: ' + d.kode + ' (demo, tidak permanen)'); if (sr) pergi('keluar'); else pergi('dokumen', k);
    };
  }

  login();
})();
</script>
</body>
</html>
