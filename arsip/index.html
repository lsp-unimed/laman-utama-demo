    try { j = JSON.parse(await r.text()); }
    catch (e) { throw new Error('Server belum siap (izin atau deployment Apps Script belum benar).'); }

      if (/Sesi berakhir|login kembali/i.test(j.pesan || '')) { keluarLokal(); login('Sesi berakhir. Silakan masuk kembali.'); }

  }

  ];
  const catat = (m, siapa) => LOG.unshift([jam(), siapa || PERAN_AKTIF, m]);

  /* ---------- Peran & hak akses (demo frontend; versi akhir disaring di backend) ----------

     kategori miliknya, lihat kategori umum, kategori terbatas (ASR, ASM) disembunyikan. */
  const PERAN_AGENDA = ['Ketua LSP', 'Admin', 'Sekretariat'];
  let PERAN_AKTIF = 'Sekretariat LSP';
  const peranBolehAgenda = () => PERAN_AGENDA.some(r => PERAN_AKTIF.toLowerCase().includes(r.toLowerCase().split(' ')[0]));

  const kunciPeran = () => { const p = PERAN_AKTIF.toLowerCase(); if (p.includes('ketua')) return 'Ketua'; if (p.includes('admin') && !p.includes('administrasi')) return 'Admin'; if (p.includes('sekretariat')) return 'Sekretariat'; if (p.includes('mutu')) return 'Mutu'; if (p.includes('sertifikasi')) return 'Sertifikasi'; if (p.includes('skema')) return 'Skema'; return 'Administrasi'; };
  const bagianSaya = () => { const k = kunciPeran(); return k === 'Sekretariat' ? 'Sekretariat' : k === 'Administrasi' ? 'Administrasi' : k === 'Sertifikasi' ? 'Bidang Sertifikasi' : k === 'Mutu' ? 'Manajemen Mutu' : k === 'Skema' ? 'Bidang Skema' : ''; };
  const bolehLihatKat = (kat) => { const k = kunciPeran(); if (['Ketua', 'Admin', 'Sekretariat'].includes(k)) return true; if (!KAT_TERBATAS.includes(kat)) return true; if (kat === 'ASR') return ['Mutu', 'Sertifikasi'].includes(k); return ['Sertifikasi', 'Administrasi'].includes(k); };
  const bolehUbahKat = (kat) => { const k = kunciPeran(); if (k === 'Ketua') return true; const h = HAK_UBAH[k]; if (h === 'SEMUA') return true; if (Array.isArray(h)) return h.includes(kat); return false; };

  const milikSaya = (d) => { const b = bagianSaya(), p = d && d.pemilik; if (!b || !p) return false; const lw = (s) => String(s).toLowerCase().split(/[^a-z]+/).filter(Boolean).pop(); return lw(b) === lw(p); };

  const bolehKelolaArsip = (d) => { const k = kunciPeran(); if (['Admin', 'Sekretariat', 'Ketua'].includes(k)) return bolehUbahKat(d.kat); return bolehUbahKat(d.kat) && milikSaya(d); };

  };
  const pager = (total, f, draw) => {
    const n = Math.max(1, Math.ceil(total / PER)); if (f.pg > n) f.pg = n;
    const el = document.getElementById('pg');
    el.innerHTML = total ? `<span>${(f.pg - 1) * PER + 1}–${Math.min(total, f.pg * PER)} dari ${total}</span><span class="pgb"><button type="button" data-p="-1" ${f.pg <= 1 ? 'disabled' : ''}>‹ Sebelumnya</button><b>${f.pg} / ${n}</b><button type="button" data-p="1" ${f.pg >= n ? 'disabled' : ''}>Berikutnya ›</button></span>` : '';
    el.onclick = (e) => { const b = e.target.closest('[data-p]'); if (b) { f.pg += +b.dataset.p; draw(); } };
  };
  const halaman = (list, f) => list.slice((f.pg - 1) * PER, f.pg * PER);
  // CSV yang aman dibuka di Excel: BOM UTF-8, pemisah titik koma, rumus dinetralkan
  const unduhCSV = (nama, head, rows) => {
    const sel = (v) => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const txt = '﻿' + [head, ...rows].map(r => r.map(sel).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = nama + '-' + HARI_INI + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Ekspor ' + rows.length + ' baris — berkas dapat dibuka di Excel');

  /* ---------- Login & kerangka ---------- */
  let PESAN_LOGIN = '';

    if (pesan) PESAN_LOGIN = pesan;

    if (!SESI) {

      if (s && s.token) { SESI = s; PERAN_AKTIF = s.peran; api('saya').then(() => { VIEW = 'ringkasan'; FK = ''; shell(); }).catch(() => { keluarLokal(); login(); }); return; }
    }
    app.innerHTML = `<div class="login"><div class="art"><div><h1>Arsip dokumen LSP UNIMED</h1><p>Ruang kerja petugas untuk membuat, mencatat, menyimpan, dan menemukan kembali seluruh dokumen lembaga — dari surat undangan sampai berita acara asesmen.</p>

    PESAN_LOGIN = '';
    const f = document.getElementById('fL');
    api('ping').then(() => { document.getElementById('loginInfo').textContent = 'Server tersambung. Silakan masuk.'; }).catch((e) => { document.getElementById('loginInfo').textContent = e.message; });

      e.preventDefault();
      const btn = document.getElementById('bMasuk'), info = document.getElementById('loginInfo');

      } catch (err) { info.textContent = err.message; btn.disabled = false; btn.textContent = 'Masuk'; }
    };
  }

    ({ ringkasan: vRingkasan, dokumen: vDokumen, arsip: vArsip, pengingat: vPengingat, agenda: vAgenda, masuk: vMasuk, keluar: vKeluar, templat: vTemplat, aktivitas: vAktivitas, pengguna: vPengguna }[VIEW] || vRingkasan)(v, T);

      ${saya.length || lewat.length || bolehSahkan() && skTunggu ? `<div class="panel" style="border-left:4px solid var(--red);margin-bottom:14px"><h2>Tugas saya</h2><ul class="list">${saya.map(s => `<li data-sm="${s.id}" style="cursor:pointer"><span><b>${esc(s.perihal)}</b><br><span class="muted" style="font-size:.82rem">Disposisi · ${esc(s.agenda)}${s.disp.some(x => x.batas && x.batas < HARI_INI) ? ' · <b style="color:var(--red)">lewat batas</b>' : ''}</span></span><span class="badge ${smB[s.status]}">${s.status}</span></li>`).join('')}${bolehSahkan() && skTunggu ? `<li><span><b>${skTunggu} surat menunggu pengesahan Ketua</b><br><span class="muted" style="font-size:.82rem">Buka Surat keluar → status Diajukan</span></span><span class="badge warn">Diajukan</span></li>` : ''}</ul></div>` : ''}

        <div class="panel"><h2>Surat keluar dalam proses</h2><ul class="list">${tunggu.map(d => `<li data-id="${d.id}" style="cursor:pointer"><span><b>${esc(d.judul)}</b><br><span class="muted code" style="font-size:.8rem">${esc(d.kode)}</span></span><span class="badge ${alurB[d.alur]}">${d.alur}</span></li>`).join('') || '<li class="muted">Tidak ada.</li>'}</ul><p style="margin:10px 0 0"><a href="#" data-go="keluar">Buka surat keluar</a></p></div>
      </div>
      <div class="grid g2">
        ${peranBolehAgenda() ? `<div class="panel"><h2>Agenda terdekat${agAktif ? ': ' + esc(agAktif.nama) : ''}</h2>${agAktif ? `<div class="bar"><i style="width:${agAktif.butir.length ? Math.round(agSiap / agAktif.butir.length * 100) : 0}%"></i></div><p class="muted" style="font-size:.88rem">${agSiap} dari ${agAktif.butir.length} butir siap${agAktif.tanggal ? ' · ' + tgl(agAktif.tanggal) : ''}.</p>
          ${agAktif.butir.filter(b => b[1] !== 'ok').slice(0, 4).map(b => `<div class="check"><span class="dot ${b[1]}"></span><div><b>${esc(b[0])}</b><div class="muted" style="font-size:.84rem">${esc(b[2] || '')}</div></div><span></span></div>`).join('')}` : '<p class="muted">Belum ada agenda.</p>'}
          <p style="margin:10px 0 0"><a href="#" data-go="agenda">Lihat semua agenda</a></p></div>` : ''}

  /* ---------- Surat masuk ---------- */
  function vMasuk(v, T) {

  function detailMasuk(id) {
    const s = SM.find(x => x.id === id);
    const bsaya = bagianSaya(), tugasIni = bsaya && s.disp.some(x => x.ke.includes(bsaya));
    const bolehDisp = ['Ketua', 'Admin', 'Sekretariat'].includes(kunciPeran());
    const back = drawer(`<div class="code" style="color:var(--red)">${esc(s.agenda)}</div><h2 style="font-size:1.25rem;margin-top:6px">${esc(s.perihal)}</h2>
      <span class="badge ${smB[s.status]}">${s.status}</span> ${s.sifat !== 'Biasa' ? `<span class="badge bad">${esc(s.sifat)}</span>` : ''}${tugasIni ? ' <span class="badge warn">Tugas Anda</span>' : ''}
      <div class="steps">${['Diterima', 'Didisposisi', 'Selesai'].map((x, i, a) => `<div class="${a.indexOf(s.status) >= i ? 'on' : ''}">${x}</div>`).join('')}</div>
      <dl class="kv"><dt>Pengirim</dt><dd>${esc(s.asal)}</dd><dt>Nomor surat</dt><dd>${esc(s.nomor)}</dd><dt>Tanggal surat</dt><dd>${tgl(s.tglSurat)}</dd><dt>Diterima</dt><dd>${tgl(s.terima)}</dd></dl>
      <div class="file"><i>PDF</i><div><b>${esc(s.berkas)}</b><div class="muted" style="font-size:.82rem">Hasil pindai surat — pada versi akhir tersimpan di Drive LSP</div></div></div>
      <div class="acts"><button class="btn ghost" data-a="cetak">Cetak lembar disposisi</button>${s.status !== 'Selesai' ? '<button class="btn ghost" data-a="selesai">Tandai selesai</button>' : ''}</div>
      <h3>Riwayat disposisi</h3>${s.disp.length ? `<div class="ver">${s.disp.map(x => `<div><b>${tgl(x.tgl)} → ${esc(x.ke.join(', '))}</b><span>${esc(x.instruksi)}${x.catatan ? ': ' + esc(x.catatan) : ''}</span>${x.batas ? `<span class="muted"> Batas ${tgl(x.batas)}</span>` : ''}</div>`).join('')}</div>` : '<p class="muted">Belum didisposisikan.</p>'}
      ${s.status !== 'Selesai' && bolehDisp ? `<h3 style="margin-top:18px">Buat disposisi${kunciPeran() === 'Ketua' ? ' (Ketua LSP)' : ''}</h3><form class="form" id="fDisp">
        <fieldset class="cek"><legend>Diteruskan kepada</legend>${BAGIAN.map(b => `<label><input type="checkbox" value="${esc(b)}"> ${esc(b)}</label>`).join('')}</fieldset>
        <label class="f">Instruksi<select name="ins">${['Tindak lanjuti', 'Pelajari dan beri saran', 'Siapkan jawaban', 'Hadiri / wakili', 'Untuk diketahui', 'Arsipkan'].map(x => `<option>${x}</option>`).join('')}</select></label>
        <label class="f">Catatan<textarea name="cat" rows="2"></textarea></label>
        <div class="row2"><label class="f">Batas waktu<input type="date" name="batas"></label><div style="align-self:end"><button class="btn" type="submit">Kirim disposisi</button></div></div>
        <p class="muted" style="font-size:.82rem;margin:0">Bagian yang dituju menerima pemberitahuan email (pada versi akhir).</p></form>` : s.status !== 'Selesai' && !bolehDisp ? '<p class="note">Disposisi dibuat oleh Ketua/Sekretariat/Admin. Anda dapat menandai selesai setelah menindaklanjuti bagian Anda.</p>' : ''}`);
    back.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]'); if (!a) return;
      if (a.dataset.a === 'cetak') window.cetakDokumen(window.lembarDisposisi(s, BAGIAN), 'Lembar disposisi ' + s.agenda);
      if (a.dataset.a === 'selesai') { s.status = 'Selesai'; catat('Menandai selesai surat masuk ' + s.agenda); tutupDrawer(); toast('Surat ' + s.agenda + ' selesai'); shell(); }
    });
    const fd = back.querySelector('#fDisp');
    if (fd) fd.onsubmit = (e) => {
      e.preventDefault();
      const ke = Array.from(fd.querySelectorAll('input[type=checkbox]:checked')).map(x => x.value);
      if (!ke.length) { toast('Pilih minimal satu bagian tujuan'); return; }
      s.disp.push({ tgl: HARI_INI, ke, instruksi: fd.ins.value, catatan: fd.cat.value.trim(), batas: fd.batas.value });
      s.status = 'Didisposisi'; catat('Mendisposisikan ' + s.agenda + ' ke ' + ke.join(', '), 'Ketua LSP');
      tutupDrawer(); toast('Disposisi terkirim ke ' + ke.join(', ')); shell(); detailMasuk(id);
    };
  }

  }

    const R = [

      ['Sekretariat', 'Semua kategori', 'Ya', 'Tidak', 'Ya'],
      ['Manajemen Mutu', 'Mutu, rapat & manajemen, asesor', 'Ya', 'Tidak', 'Tidak'],
      ['Bidang Sertifikasi', 'Asesor, tempat uji, rekaman asesmen', 'Ya', 'Tidak', 'Tidak'],
      ['Bidang Skema', 'Skema & MUK', 'Ya', 'Tidak', 'Tidak'],

      <div class="table-wrap"><table><thead><tr><th>Peran</th><th>Kategori yang dapat diubah</th><th>Buat & unggah</th><th>Sahkan surat</th><th>Ubah kop & templat</th></tr></thead><tbody>${R.map(r => `<tr><td data-l="Peran"><b>${r[0]}</b></td><td data-l="Kategori">${r[1]}</td><td data-l="Buat & unggah">${r[2]}</td><td data-l="Sahkan surat">${r[3]}</td><td data-l="Ubah kop">${r[4]}</td></tr>`).join('')}</tbody></table></div>
      <div class="panel" style="margin-top:14px"><h2>Ganti password saya</h2><form class="form" id="fPw"><label class="f">Password lama<input type="password" name="lama" required autocomplete="current-password"></label><label class="f">Password baru (min. 8 karakter)<input type="password" name="baru" required minlength="8" autocomplete="new-password"></label><div><button class="btn" type="submit">Simpan password</button></div><p class="muted" style="font-size:.84rem;margin:0" id="pwInfo"></p></form></div>
      <div class="panel" style="margin-top:14px"><h2>Daftar akun</h2><div id="akunList"><p class="muted">Memuat…</p></div>${kelola ? `<h2 style="margin-top:16px">Buat akun baru</h2><form class="form" id="fAkun"><div class="row2"><label class="f">Username<input name="username" required pattern="[a-z0-9._]{3,30}" placeholder="huruf kecil, mis. sekretariat"></label><label class="f">Nama lengkap<input name="nama" required></label></div><div class="row2"><label class="f">Peran<select name="peran"><option>Ketua LSP</option><option>Admin</option><option>Sekretariat</option><option>Administrasi</option><option>Bidang Sertifikasi</option><option>Manajemen Mutu</option><option>Bidang Skema</option></select></label><label class="f">Password awal (min. 8)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label></div><div><button class="btn" type="submit">Buat akun</button></div><p class="muted" style="font-size:.84rem;margin:0" id="akunInfo"></p></form><div id="editAkun"></div>` : '<p class="muted" style="font-size:.86rem">Penambahan akun dan reset sandi hanya oleh Admin atau Ketua LSP.</p>'}</div>
      <p class="muted" style="font-size:.86rem;margin-top:12px">Semua peran dapat melihat dan mengunduh dokumen kategori umum. Kategori asesor dan rekaman asesmen hanya terbuka untuk Sekretariat, Sertifikasi, dan Manajemen Mutu.</p>`;

        el.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
          const pwBaru = prompt('Password baru untuk @' + b.dataset.reset + ' (min. 8 karakter):');
          if (!pwBaru) return;
          try { await api('aturSandi', { data: { username: b.dataset.reset, password: pwBaru } }); toast('Sandi @' + b.dataset.reset + ' direset'); }
          catch (err) { toast(err.message); }
        });
        el.querySelectorAll('[data-hapus]').forEach(b => b.onclick = async () => {
          if (!confirm('Hapus akun @' + b.dataset.hapus + '? Akun langsung tidak bisa masuk.')) return;
          try { await api('hapusPengguna', { data: { username: b.dataset.hapus } }); toast('Akun @' + b.dataset.hapus + ' dihapus'); muatAkun(); }
          catch (err) { toast(err.message); }
        });
        el.querySelectorAll('[data-ubah]').forEach(b => b.onclick = () => bukaUbah(b.dataset.ubah, list));
      } catch (err) { el.innerHTML = `<p class="muted">${esc(err.message)}</p>`; }
    };
    const bukaUbah = (usernameLama, list) => {
      const a = (list || []).find(x => x.username === usernameLama) || { username: usernameLama, nama: '', peran: 'Sekretariat', aktif: 'YA' };
      const box = v.querySelector('#editAkun');
      const opsi = ['Ketua LSP', 'Admin', 'Sekretariat', 'Administrasi', 'Bidang Sertifikasi', 'Manajemen Mutu', 'Bidang Skema'].map(p => `<option${p === a.peran ? ' selected' : ''}>${p}</option>`).join('');
      box.innerHTML = `<h2 style="margin-top:16px">Ubah akun @${esc(usernameLama)}</h2><form class="form" id="fUbah"><div class="row2"><label class="f">Username baru<input name="username" required pattern="[a-z0-9._]{3,30}" value="${esc(a.username)}"></label><label class="f">Nama lengkap<input name="nama" required value="${esc(a.nama)}"></label></div><div class="row2"><label class="f">Peran<select name="peran">${opsi}</select></label><label class="f">Status<select name="aktif"><option value="YA"${(a.aktif || 'YA') === 'YA' ? ' selected' : ''}>YA (aktif)</option><option value="TIDAK"${a.aktif === 'TIDAK' ? ' selected' : ''}>TIDAK (nonaktif)</option></select></label></div><label class="f">Password baru (kosongkan bila tidak diganti, min. 8)<input type="password" name="password" minlength="8" autocomplete="new-password" placeholder="kosongkan bila tidak diganti"></label><div style="display:flex;gap:8px"><button class="btn" type="submit">Simpan perubahan</button><button class="btn ghost" type="button" id="bBatalUbah">Batal</button></div><p class="muted" style="font-size:.84rem;margin:0" id="ubahInfo"></p></form>`;
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
      box.querySelector('#bBatalUbah').onclick = () => { box.innerHTML = ''; };
      box.querySelector('#fUbah').onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target, info = box.querySelector('#ubahInfo'); info.textContent = 'Menyimpan…';
        try {
          const isi = { lama: usernameLama, username: f.username.value.trim(), nama: f.nama.value.trim(), peran: f.peran.value, aktif: f.aktif.value };
          if (f.password.value) isi.password = f.password.value;
          const r = await api('simpanPengguna', { data: isi });
          info.textContent = 'Tersimpan.';
          // Bila username sendiri diganti, perbarui sesi lokal.
          if (SESI && SESI.username === usernameLama && r && r.username && r.username !== usernameLama) {
            SESI.username = r.username; SESI.nama = r.nama || SESI.nama; SESI.peran = r.peran || SESI.peran;
            try { (SESI.ingat ? localStorage : sessionStorage).setItem('arsip_sesi', JSON.stringify(SESI)); } catch (err) {}
          }
          toast('Akun @' + usernameLama + ' diperbarui'); box.innerHTML = ''; muatAkun(); shell();
        } catch (err) { info.textContent = err.message; }
      };
    };
    muatAkun();
    const fa = v.querySelector('#fAkun');
    if (fa) fa.onsubmit = async (e) => {
      e.preventDefault();
      const info = v.querySelector('#akunInfo'); info.textContent = 'Membuat akun…';
      try {
        await api('simpanPengguna', { data: { username: fa.username.value.trim(), nama: fa.nama.value.trim(), peran: fa.peran.value, password: fa.password.value } });
        info.textContent = 'Akun dibuat.'; fa.reset(); muatAkun();
      } catch (err) { info.textContent = err.message; }
    };
  }

  /* ---------- Detail dokumen / surat keluar ---------- */
  function detail(id) {
    tutupDrawer();
    const d = DOCS.find(x => x.id === id), s = status(d);
    if (!bolehLihatKat(d.kat)) { drawer('<h2>Akses terbatas</h2><p class="muted">Dokumen kategori ini tidak dapat dibuka oleh peran Anda.</p>'); return; }
    const bisaUbah = bolehUbahKat(d.kat);
    const vers = Array.from({ length: d.rev }, (_, i) => d.rev - i).map(r => `<div><b>Revisi ${r}${r === d.rev ? ' (berlaku)' : ''}</b><span class="muted">${r === d.rev ? tgl(d.terbit || HARI_INI) : 'Diganti oleh revisi ' + (r + 1)}</span></div>`).join('');
    let aksi = '';
    if (d.surat) {
      const i = ALUR.indexOf(d.alur);
      aksi = { Draf: (d.tpl && bisaUbah ? '<button class="btn ghost" data-a="ubah">Ubah draf</button>' : '') + (bisaUbah ? '<button class="btn" data-a="ajukan">Ajukan pengesahan</button>' : ''),
        Diajukan: bolehSahkan() ? '<button class="btn" data-a="sahkan">Sahkan (Ketua)</button><button class="btn ghost" data-a="kembali">Kembalikan ke draf</button>' : '<p class="note">Menunggu pengesahan Ketua LSP.</p>',
        Disahkan: bisaUbah ? '<button class="btn" data-a="kirim">Tandai terkirim</button><button class="btn ghost" data-a="Unggah pindaian bertanda tangan (demo)">Unggah versi bertanda tangan</button>' : '', Terkirim: '' }[d.alur];
      aksi = `<div class="steps">${ALUR.map((x, j) => `<div class="${i >= j ? 'on' : ''}">${x === 'Disahkan' ? 'Disahkan Ketua' : x}</div>`).join('')}</div>${aksi ? `<div class="acts">${aksi}</div>` : ''}${d.alur === 'Diajukan' && !bolehSahkan() ? '<p class="muted" style="font-size:.82rem;margin-top:-8px">Tombol Sahkan hanya tampil untuk akun Ketua LSP; Ketua menerima pemberitahuan saat ada surat diajukan.</p>' : ''}`;
      if (!bisaUbah && !bolehSahkan() && d.alur === 'Draf') aksi += '';
    } else if (d.tpl && d.status === 'Draf' && bisaUbah) aksi = '<div class="acts"><button class="btn ghost" data-a="ubah">Ubah draf</button></div>';
    else if (!bisaUbah && !d.surat) aksi = '<p class="note">Dokumen ini baca-saja untuk peran Anda.</p>';
    // Kelola dokumen: semua jenis bisa diarsipkan & dihapus (mis. salah input).
    // Aturan: Admin/Sekretariat (+Ketua) semua kategori; peran lain hanya dokumen miliknya.
    const kelola = bolehKelolaArsip(d);
    if (kelola && !d.arsip) {
      aksi += `<div class="acts"><button class="btn ghost" data-a="edit">Ubah data</button><button class="btn ghost" data-a="arsip">Arsipkan</button><button class="btn ghost" data-a="hapus">Hapus</button></div>`;
    } else if (kelola && d.arsip) {
      aksi += `<div class="acts"><button class="btn ghost" data-a="keluar-arsip">Keluarkan dari arsip</button><button class="btn ghost" data-a="hapus">Hapus</button></div>`;
    } else if (bisaUbah && !d.arsip) {
      aksi += `<div class="acts"><button class="btn ghost" data-a="edit">Ubah data</button></div>`;
    }
    const back = drawer(`<div class="code" style="color:var(--red)">${esc(d.kode)}</div><h2 style="font-size:1.25rem;margin-top:6px">${esc(d.judul)}</h2>${d.surat ? `<span class="badge ${alurB[d.alur]}">${d.alur}</span>` : `<span class="badge ${s[1]}">${s[0]}</span>`}
      ${aksi}
      <dl class="kv"><dt>Kategori</dt><dd>${esc(katNama(d.kat))}</dd><dt>Penanggung jawab</dt><dd>${esc(d.pemilik)}</dd><dt>Tanggal</dt><dd>${tgl(d.terbit)}</dd><dt>Berlaku sampai</dt><dd>${d.sampai ? tgl(d.sampai) : 'Tidak terbatas'}</dd><dt>Sumber</dt><dd>${d.tpl ? 'Dibuat dari templat ' + esc((window.TEMPLAT.find(t => t.id === d.tpl.id) || {}).nama || '') : 'Berkas diunggah'}</dd><dt>Masa simpan</dt><dd>${esc((KAT.find(k => k[0] === d.kat) || [])[3])}</dd><dt>Akses</dt><dd>${d.kat === 'ASM' || d.kat === 'ASR' ? 'Terbatas: Sekretariat, Sertifikasi, Manajemen Mutu' : 'Seluruh petugas LSP'}</dd></dl>
      <div class="file"><i>PDF</i><div><b>${esc(d.berkas)}</b><div class="muted" style="font-size:.82rem">${d.tpl ? 'PDF disusun otomatis dari templat' : 'Berkas contoh — pada versi akhir tersimpan di Drive LSP'}</div></div></div>
      <div class="acts">${d.tpl ? '<button class="btn" data-a="lihat">Lihat & cetak</button>' : ''}<button class="btn ghost" data-a="Unduhan dicatat (demo)">Unduh</button>${bisaUbah ? '<button class="btn ghost" data-a="Formulir revisi dibuka (demo)">Unggah revisi</button>' : ''}</div>
      ${d.tpl ? `<h3>Pratinjau</h3><div class="mini"><div class="kertas">${htmlDok(d)}</div></div>` : ''}
      <h3 style="margin-top:16px">Riwayat revisi</h3><div class="ver">${vers}</div>`);
    const mini = back.querySelector('.mini');
    if (mini) { const k = mini.firstElementChild, sc = () => { const r = mini.clientWidth / k.offsetWidth; k.style.transform = `scale(${r})`; mini.style.height = Math.min(k.offsetHeight * r, 520) + 'px'; }; requestAnimationFrame(sc); }
    back.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]'); if (!a) return;
      const act = a.dataset.a, ubahAlur = (al, pesan, siapa) => { if (al === 'Disahkan' && !bolehSahkan()) { toast('Hanya Ketua LSP yang dapat mengesahkan'); return; } if (['Diajukan', 'Draf', 'Terkirim'].includes(al) && !bisaUbah && al !== 'Draf') { toast('Di luar kategori Anda'); return; } d.alur = al; d.status = al === 'Disahkan' || al === 'Terkirim' ? 'Berlaku' : 'Draf'; catat(pesan + ' ' + d.kode, siapa); toast(pesan + ' ' + d.kode); shell(); detail(id); };
      if (act === 'lihat') window.cetakDokumen(htmlDok(d), d.judul);
      else if (act === 'ubah') { if (!bisaUbah) { toast('Di luar kategori Anda'); return; } tutupDrawer(); window.bukaTemplat(d.tpl.id, API, { id: d.id, kat: d.kat, nomor: d.kode, data: d.tpl.data }); }
      else if (act === 'ajukan') { if (!bisaUbah) { toast('Di luar kategori Anda'); return; } ubahAlur('Diajukan', 'Mengajukan pengesahan'); }
      else if (act === 'kembali') { if (!bolehSahkan()) { toast('Hanya Ketua LSP'); return; } ubahAlur('Draf', 'Mengembalikan ke draf', 'Ketua LSP'); }
      else if (act === 'sahkan') ubahAlur('Disahkan', 'Mengesahkan', 'Ketua LSP');
      else if (act === 'kirim') { if (!bisaUbah) { toast('Di luar kategori Anda'); return; } ubahAlur('Terkirim', 'Menandai terkirim'); }
      else if (act === 'edit') { if (!bolehKelolaArsip(d) && !bisaUbah) { toast('Di luar kategori Anda'); return; } tutupDrawer(); formEditDok(id); }
      else if (act === 'arsip') { if (!bolehKelolaArsip(d)) { toast('Hanya Admin/Sekretariat, atau pemilik dokumen di kategorinya'); return; } d.arsip = true; d.status = 'Berlaku'; if (!d.terbit) d.terbit = HARI_INI; catat('Mengarsipkan ' + d.kode); toast('Diarsipkan: ' + d.kode); shell(); detail(id); }
      else if (act === 'keluar-arsip') { if (!bolehKelolaArsip(d)) { toast('Hanya Admin/Sekretariat, atau pemilik dokumen di kategorinya'); return; } d.arsip = false; catat('Mengeluarkan dari arsip ' + d.kode); toast('Dikeluarkan dari arsip: ' + d.kode); shell(); detail(id); }
      else if (act === 'hapus') { if (!bolehKelolaArsip(d)) { toast('Hanya Admin/Sekretariat, atau pemilik dokumen di kategorinya'); return; } if (!confirm('Hapus ' + (d.surat ? 'surat ' : 'dokumen ') + d.kode + ' — ' + d.judul + '?' + (d.arsip ? ' (dokumen arsip)' : ''))) return; DOCS = DOCS.filter(x => x.id !== id); catat('Menghapus ' + d.kode); tutupDrawer(); shell(); toast('Dihapus: ' + d.kode); }
      else toast(act);
    });
  }

  /* ---------- Ubah data dokumen (judul, kategori, penanggung jawab, tanggal) ---------- */
  function formEditDok(id) {
    const d = DOCS.find(x => x.id === id);
    if (!bolehUbahKat(d.kat)) { toast('Di luar kategori Anda'); return; }
    const katBoleh = KAT.filter(k => bolehUbahKat(k[0]));
    const back = drawer(`<h2>Ubah data dokumen</h2><p class="muted" style="margin-top:-6px">${esc(d.kode)}</p>
      <form class="form" id="fED"><label class="f">Judul / perihal<input name="judul" required value="${esc(d.judul)}"></label>
      <label class="f">Kategori arsip<select name="kat">${katBoleh.map(k => `<option value="${k[0]}"${k[0] === d.kat ? ' selected' : ''}>${esc(k[1])}</option>`).join('')}</select></label>
      <label class="f">Penanggung jawab<input name="pemilik" value="${esc(d.pemilik || '')}"></label>
      <div class="row2"><label class="f">Tanggal<input type="date" name="terbit" value="${esc(d.terbit || '')}"></label><label class="f">Berlaku sampai (opsional)<input type="date" name="sampai" value="${esc(d.sampai || '')}"></label></div>
      <div><button class="btn" type="submit">Simpan perubahan</button></div></form>`);
    const f = back.querySelector('#fED');
    f.onsubmit = (e) => {
      e.preventDefault();
      const k = f.kat.value;
      if (!bolehUbahKat(k)) { toast('Kategori ' + k + ' di luar wewenang peran Anda'); return; }
      Object.assign(d, { judul: f.judul.value.trim(), kat: k, pemilik: f.pemilik.value.trim() || d.pemilik, terbit: f.terbit.value, sampai: f.sampai.value });
      catat('Mengubah data ' + d.kode); tutupDrawer(); toast('Perubahan tersimpan: ' + d.kode); shell(); detail(id);
    };
  }

  /* ---------- Dokumen baru: pilih cara ---------- */
  function pilih(hanyaSurat) {
    tutupDrawer();
    const tp = window.TEMPLAT.filter(t => (!hanyaSurat || t.surat) && bolehUbahKat(t.kat));
    const bsMasuk = bolehCatatMasuk() && !hanyaSurat;
    const back = drawer(`<h2>${hanyaSurat ? 'Buat surat keluar' : 'Dokumen baru'}</h2><p class="muted">Pilih cara mencatat dokumen.${tp.length < window.TEMPLAT.length ? ' Templat di luar kategori Anda disembunyikan.' : ''}</p>
      <div class="choice"><button type="button" data-c="templat" class="on"><b>Buat di web dari templat</b><span>Isi formulir singkat; sistem menyusun dokumen lengkap dengan kop surat, nomor manual sesuai buku agenda, dan tanda tangan. Siap dicetak atau disimpan PDF.</span></button>
      <button type="button" data-c="unggah"><b>Unggah berkas</b><span>Dokumen sudah jadi (PDF hasil pindai atau dari aplikasi lain). Sistem memberi nomor register dan menyimpan berkasnya.</span></button>
      ${bsMasuk ? '<button type="button" data-c="masuk"><b>Catat surat masuk</b><span>Surat dari pihak lain: beri nomor agenda, unggah pindaian, lalu disposisikan.</span></button>' : ''}</div>
      <h3 style="margin-top:18px" id="tplH">Pilih templat</h3><ul class="list">${tp.map(t => `<li><span><b>${esc(t.nama)}</b> <span class="chip">${t.surat ? 'surat' : 'dokumen'}</span><br><span class="muted" style="font-size:.84rem">${esc(t.ket)}</span></span><button class="btn ghost" type="button" data-t="${t.id}">Gunakan</button></li>`).join('') || '<li class="muted">Tidak ada templat untuk kategori Anda.</li>'}</ul>`);
    back.addEventListener('click', (e) => {
      const c = e.target.closest('[data-c]'), t = e.target.closest('[data-t]');
      if (c && c.dataset.c === 'unggah') { tutupDrawer(); form(hanyaSurat); }
      else if (c && c.dataset.c === 'masuk') { if (!bolehCatatMasuk()) { toast('Hanya Admin, Sekretariat, atau Ketua yang dapat mencatat surat masuk'); return; } formMasuk(); }
      else if (c) back.querySelector('#tplH').scrollIntoView({ behavior: 'smooth' });
      else if (t) { const tm = window.TEMPLAT.find(x => x.id === t.dataset.t); if (!bolehUbahKat(tm.kat)) { toast('Templat ini di luar kategori Anda'); return; } tutupDrawer(); window.bukaTemplat(t.dataset.t, API); }
    });
  }

  /* Jembatan untuk editor templat (templat.js) */
  const API = {
    hariIni: HARI_INI, KAT,
    nomorSurat(kode, t) { t = t || HARI_INI; return `${pad(seq.SURAT + 1)}/LSP-UNIMED/${kode}/${romawi(+t.slice(5, 7))}/${t.slice(0, 4)}`; },
    nomorDok(k) { return `LSP-UNIMED/${k}/${pad((seq[k] || 0) + 1)}/${HARI_INI.slice(0, 4)}`; },
    nomorTerakhir(n) { return DOCS.filter(d => d.surat).map(d => d.kode).sort((a, b) => b.localeCompare(a)).slice(0, n || 5); },
    simpan(o) {
      const katTujuan = o.kat || (o.id && (DOCS.find(x => x.id === o.id) || {}).kat);
      if (katTujuan && !bolehUbahKat(katTujuan)) { toast('Kategori ' + katTujuan + ' di luar wewenang peran Anda'); return; }
      const stt = o.surat ? (o.alur === 'Disahkan' ? 'Berlaku' : 'Draf') : (o.alur === 'Berlaku' ? 'Berlaku' : 'Draf');
      let d;
      if (o.id) {
        d = DOCS.find(x => x.id === o.id);
        Object.assign(d, { judul: o.judul, kat: o.kat, tpl: o.tpl, terbit: o.tanggal, status: stt }); if (d.surat) d.alur = o.alur === 'Diajukan' ? 'Diajukan' : 'Draf';
        catat((d.alur === 'Diajukan' ? 'Mengajukan pengesahan ' : 'Memperbarui draf ') + d.kode);
      } else {
        if (o.surat) seq.SURAT++; else seq[o.kat] = (seq[o.kat] || 0) + 1;
        d = { id: DOCS.length + 1, kode: o.nomor, kat: o.kat, judul: o.judul, pemilik: 'Sekretariat', terbit: o.tanggal || HARI_INI, sampai: '', status: stt, rev: 1, berkas: o.judul.replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.pdf', tpl: o.tpl };
        if (o.surat) { d.surat = true; d.alur = o.alur; }
        DOCS.push(d); catat('Membuat ' + o.jenis.toLowerCase() + ' ' + d.kode + ' dari templat');
      }
      toast((d.surat ? (d.alur === 'Diajukan' ? 'Diajukan ke Ketua: ' : 'Draf tersimpan: ') : (stt === 'Berlaku' ? 'Diarsipkan: ' : 'Draf tersimpan: ')) + d.kode);
      if (d.surat) pergi('keluar'); else pergi('dokumen', d.kat);
      detail(d.id);
    }
  };

  /* ---------- Unggah berkas ---------- */
  function form(surat) {
    const katBoleh = KAT.filter(k => bolehUbahKat(k[0]));
    if (!katBoleh.length) { toast('Tidak ada kategori yang dapat Anda ubah'); return; }
    const back = drawer(`<h2>Unggah berkas</h2><p class="muted" style="margin-top:-6px">Kategori dibatasi sesuai wewenang peran Anda (${esc(PERAN_AKTIF)}).</p>
      <form class="form" id="fD">${surat ? '' : `<label class="f">Jenis<select name="jenis"><option value="dok">Dokumen (register LSP-UNIMED/kategori)</option><option value="surat">Surat keluar (nomor dari buku agenda)</option></select></label>`}
      <label class="f">Kategori arsip<select name="kat">${katBoleh.map(k => `<option value="${k[0]}"${surat && k[0] === 'KOR' ? ' selected' : ''}>${esc(k[1])}</option>`).join('')}</select></label>
      <label class="f">Judul / perihal<input name="judul" required placeholder="mis. Berita Acara Asesmen Skema Web Developer"></label>
      <label class="f" id="kodeJ" hidden>Kode jenis surat<input name="kj" value="PB" maxlength="5"><small class="muted" style="font-weight:400">mis. UND undangan, ST surat tugas, SK keputusan, PB pemberitahuan</small></label>
      <div class="row2"><label class="f">Tanggal<input type="date" name="terbit" value="${HARI_INI}"></label><label class="f">Berlaku sampai (opsional)<input type="date" name="sampai"></label></div>
      <div class="row2"><label class="f">Penanggung jawab<select name="pemilik"><option>Sekretariat</option><option>Administrasi</option><option>Sertifikasi</option><option>Manajemen Mutu</option><option>Skema</option></select></label><label class="f">Status<select name="status"><option>Berlaku</option><option>Draf</option></select></label></div>
      <label class="f">Berkas (PDF, DOCX, XLSX, JPG)<input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></label>
      <p class="note" id="noPrev"></p><div><button class="btn" type="submit">Simpan dokumen</button></div></form>`);
    const f = back.querySelector('#fD');
    const isSurat = () => surat || (f.jenis && f.jenis.value === 'surat');
    const nomor = () => isSurat() ? API.nomorSurat((f.kj.value || 'PB').toUpperCase().replace(/[^A-Z]/g, ''), f.terbit.value) : `LSP-UNIMED/${f.kat.value}/${pad((seq[f.kat.value] || 0) + 1)}/${(f.terbit.value || HARI_INI).slice(0, 4)}`;
    const prev = () => { back.querySelector('#kodeJ').hidden = !isSurat(); back.querySelector('#noPrev').textContent = 'Nomor otomatis: ' + nomor(); };
    f.addEventListener('input', prev); f.addEventListener('change', prev); prev();
    f.onsubmit = (e) => {
      e.preventDefault(); const k = f.kat.value, no = nomor(), sr = isSurat();
      if (!bolehUbahKat(k)) { toast('Kategori ' + k + ' di luar wewenang peran Anda'); return; }
      if (sr) seq.SURAT++; else seq[k] = (seq[k] || 0) + 1;
      const d = { id: DOCS.length + 1, kode: no, kat: k, judul: f.judul.value.trim(), pemilik: f.pemilik.value, terbit: f.terbit.value, sampai: f.sampai.value, status: f.status.value, rev: 1, berkas: 'berkas_baru.pdf' };
      if (sr) { d.surat = true; d.alur = f.status.value === 'Berlaku' ? 'Disahkan' : 'Draf'; }
      DOCS.push(d); catat('Mengunggah ' + d.judul);
      tutupDrawer(); toast('Dokumen tersimpan: ' + d.kode + ' (demo, tidak permanen)'); if (sr) pergi('keluar'); else pergi('dokumen', k);
    };
  }

  login();
})();
</script>
</body>
</html>
